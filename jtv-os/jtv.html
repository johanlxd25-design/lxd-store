<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JTV OS — Inicio</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:#000; color:#fff;
    font-family:"Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow:hidden; user-select:none;
  }
  .pantalla { height:100vh; display:flex; flex-direction:column; padding:2.4vh 3vw 1.8vh; }

  /* ---------- cabecera ---------- */
  header { display:flex; align-items:center; justify-content:space-between; }
  .perfil { display:flex; align-items:center; gap:14px; }
  .avatar {
    width:64px; height:64px; border-radius:50%;
    background:#FF2E7E; color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:34px; font-weight:800;
  }
  .perfil .nombre { font-size:26px; font-weight:700; }
  .perfil .sub { font-size:15px; color:#9aa0a6; margin-top:2px; }
  .reloj { text-align:center; }
  .reloj .hora { font-size:110px; font-weight:800; line-height:1; letter-spacing:2px; }
  .reloj .fecha { font-size:21px; color:#c7cbd1; margin-top:6px; }
  .estado { display:flex; align-items:center; gap:16px; }
  .wifi { width:48px; height:48px; }
  .wifi .arco { fill:none; stroke:#FF2E7E; stroke-width:5; stroke-linecap:round; }
  .wifi .punto { fill:#FF2E7E; }
  .wifi.off .arco, .wifi.off .punto { stroke:#666; fill:#666; }
  .wifi.off .tacha { stroke:#ff3b30; stroke-width:5; stroke-linecap:round; }

  /* ---------- tarjetas ---------- */
  main { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .fila { display:flex; gap:1.6vw; }
  .tarjeta {
    flex:1; height:44vh; border-radius:28px; cursor:pointer; outline:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    transition:transform .16s ease, box-shadow .16s ease;
    border:3px solid transparent; text-decoration:none; color:#fff;
  }
  .tarjeta .logo { width:30%; max-width:130px; }
  .tarjeta .nombre { font-size:34px; font-weight:800; }
  .tarjeta .desc { font-size:17px; color:rgba(255,255,255,.75); }
  .tarjeta.enfocada {
    transform:scale(1.055);
    border-color:#FF2E7E;
    box-shadow:0 0 0 4px rgba(255,46,126,.35), 0 18px 44px rgba(255,46,126,.28);
    z-index:2;
  }
  .yt { background:linear-gradient(160deg,#ff1f1f,#b30000); }
  .sp { background:linear-gradient(160deg,#1ed760,#0d7a33); }
  .nf { background:linear-gradient(160deg,#e50914,#5c0505); }
  .jm { background:linear-gradient(160deg,#FF2E7E,#8f0f45); }

  footer { display:flex; justify-content:space-between; align-items:center; color:#8a8f96; font-size:16px; padding-top:1vh; }
  footer b { color:#c7cbd1; }
</style>
</head>
<body>
<div class="pantalla">
  <header>
    <div class="perfil">
      <div class="avatar">D</div>
      <div>
        <div class="nombre">Darko</div>
        <div class="sub">JTV OS · v0.2</div>
      </div>
    </div>
    <div class="reloj">
      <div class="hora" id="hora">--:--</div>
      <div class="fecha" id="fecha">cargando fecha…</div>
    </div>
    <div class="estado">
      <svg class="wifi" id="wifi" viewBox="0 0 48 48" aria-label="WiFi">
        <path class="arco" d="M6 18 A26 26 0 0 1 42 18" />
        <path class="arco" d="M12 25 A17 17 0 0 1 36 25" />
        <path class="arco" d="M18 31.5 A9 9 0 0 1 30 31.5" />
        <circle class="punto" cx="24" cy="38" r="3.4" />
        <line class="tacha" x1="8" y1="8" x2="40" y2="40" style="display:none" />
      </svg>
    </div>
  </header>

  <main>
    <div class="fila" id="fila-apps">
      <a class="tarjeta yt" data-url="https://www.youtube.com" href="https://www.youtube.com">
        <svg class="logo" viewBox="0 0 100 70"><rect x="2" y="4" width="96" height="62" rx="16" fill="#fff"/><path d="M42 22 L68 35 L42 48 Z" fill="#ff1f1f"/></svg>
        <div class="nombre">YouTube</div>
        <div class="desc">Videos y música</div>
      </a>
      <a class="tarjeta sp" data-url="https://open.spotify.com" href="https://open.spotify.com">
        <svg class="logo" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#fff"/><g stroke="#0d7a33" stroke-width="8" stroke-linecap="round" fill="none"><path d="M28 40 Q50 32 72 40"/><path d="M30 54 Q50 47 70 54"/><path d="M32 67 Q50 61 68 67"/></g></svg>
        <div class="nombre">Spotify</div>
        <div class="desc">Tu música</div>
      </a>
      <a class="tarjeta nf" data-url="https://www.netflix.com" href="https://www.netflix.com">
        <svg class="logo" viewBox="0 0 100 100"><path d="M22 8 H40 V92 H22 Z M60 8 H78 V92 H60 Z M40 8 L78 92 H60 L22 8 Z" fill="#fff"/></svg>
        <div class="nombre">Netflix</div>
        <div class="desc">Series y películas</div>
      </a>
      <a class="tarjeta jm" data-url="https://music.youtube.com" href="https://music.youtube.com">
        <svg class="logo" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#fff"/><path d="M58 26 v34 a12 12 0 1 1 -6 -10 V26 Z" fill="#FF2E7E"/><circle cx="46" cy="66" r="9" fill="#FF2E7E"/></svg>
        <div class="nombre">J-Music</div>
        <div class="desc">Música de YouTube</div>
      </a>
    </div>
  </main>

  <footer>
    <div><b>← →</b> moverte &nbsp;·&nbsp; <b>Enter</b> entrar &nbsp;·&nbsp; <b>Atrás</b> volver al Inicio</div>
    <div>JTV OS · solo lo básico, fluido</div>
  </footer>
</div>

<script>
(function () {
  // Reloj y fecha
  function tick() {
    var ahora = new Date();
    document.getElementById('hora').textContent =
      String(ahora.getHours()).padStart(2, '0') + ':' + String(ahora.getMinutes()).padStart(2, '0');
    document.getElementById('fecha').textContent =
      ahora.toLocaleDateString('es-VE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }
  tick(); setInterval(tick, 1000);

  // WiFi: rosado con conexión, gris con rayita roja sin ella
  function wifi() {
    var el = document.getElementById('wifi');
    var tacha = el.querySelector('.tacha');
    if (navigator.onLine) { el.classList.remove('off'); tacha.style.display = 'none'; }
    else { el.classList.add('off'); tacha.style.display = ''; }
  }
  wifi();
  window.addEventListener('online', wifi);
  window.addEventListener('offline', wifi);

  // Navegación como TV: flechas mueven el foco, Enter entra, Retroceso vuelve
  var tarjetas = Array.from(document.querySelectorAll('#fila-apps .tarjeta'));
  var c = 0;
  function pintar() {
    tarjetas.forEach(function (t) { t.classList.remove('enfocada'); });
    var el = tarjetas[c];
    el.classList.add('enfocada');
    el.focus({ preventScroll: true });
  }
  pintar();
  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowRight') { c = Math.min(c + 1, tarjetas.length - 1); pintar(); e.preventDefault(); }
    else if (k === 'ArrowLeft') { c = Math.max(c - 1, 0); pintar(); e.preventDefault(); }
    else if (k === 'ArrowUp' || k === 'ArrowDown') { e.preventDefault(); }
    else if (k === 'Enter') { window.location.href = tarjetas[c].dataset.url; }
    else if (k === 'Backspace' || k === 'Escape') { history.back(); e.preventDefault(); }
  });
  tarjetas.forEach(function (t, i) {
    t.addEventListener('mouseenter', function () { c = i; pintar(); });
  });
})();
</script>
</body>
</html>
